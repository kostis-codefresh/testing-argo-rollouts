---
# Scenario A from issue #208: the ignoreDifferences snippet recommended in the
# plugin's docs/quick-start.md, with the two sync options the reporter says do
# NOT help (ServerSideApply + RespectIgnoreDifferences).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gatewayapi-in-progress-labels
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/kostis-codefresh/testing-argo-rollouts
    targetRevision: HEAD
    path: in-progress-labels/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: gatewayapi-demo
  syncPolicy:
    automated:
      # selfHeal is deliberately off so the canary can be driven out-of-band with
      # `kubectl argo rollouts set image`. With selfHeal on, Argo CD reverts the
      # Rollout spec back to git within seconds and the canary never starts.
      # It is not needed for scenario A: #208 is about diff/sync status, and
      # selfHeal only matters for the weight-reversion variant (out of scope).
      selfHeal: false
      prune: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      jqPathExpressions:
        - select(.metadata.labels["rollouts.argoproj.io/gatewayapi-canary"] == "in-progress") | .spec.rules
    # Not part of #208 — just noise removal. The Rollouts controller injects
    # rollouts-pod-template-hash into the selector of the stable and canary
    # Services, so both go OutOfSync after the first canary. Unlike the
    # expression above this one is unconditional, so it evaluates identically
    # on the live and the desired object.
    - group: ""
      kind: Service
      jsonPointers:
        - /spec/selector/rollouts-pod-template-hash
